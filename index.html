<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر بريم - Prime Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Pro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#050811',
                        cardBg: '#0b1120',
                        neonCyan: '#00f2fe',
                        neonPurple: '#a855f7',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #050811;
            background-image: 
                radial-gradient(at 50% 0%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .cyber-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.9) 0%, rgba(8, 12, 24, 0.95) 100%);
            border: 1px solid rgba(0, 242, 254, 0.15);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cyber-card:hover {
            border-color: rgba(0, 242, 254, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 15px 30px -5px rgba(0, 242, 254, 0.2);
        }

        .video-btn-modern {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(126, 34, 206, 0.4) 100%);
            border: 1px solid rgba(168, 85, 247, 0.6);
            color: #f3e8ff;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.25);
            transition: all 0.3s ease;
        }

        .video-btn-modern:hover {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.45) 0%, rgba(126, 34, 206, 0.65) 100%);
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            color: #ffffff;
            transform: scale(1.02);
        }

        .play-icon-pulse {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .img-preview-badge {
            background: rgba(5, 8, 17, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #00f2fe;
            transition: all 0.3s ease;
        }

        .img-preview-badge:hover {
            background: rgba(0, 242, 254, 0.25);
            color: #ffffff;
        }

        .whatsapp-buy-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #0284c7 100%);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: all 0.3s ease;
        }

        .whatsapp-buy-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
            transform: scale(1.03);
        }

        .sold-out-badge {
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(4px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="py-4 sm:py-8 px-3 sm:px-6">

    <main class="max-w-7xl mx-auto w-full">
        <div id="loading" class="text-center py-28 text-cyan-400 text-sm sm:text-base">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3 text-cyan-400"></i><br>جاري تحميل أحدث المنتجات...
        </div>

        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5 sm:gap-5">
            <!-- Products Loaded Here -->
        </div>

        <div id="noProducts" class="hidden text-center py-28 text-slate-400 text-sm">
            <i class="fa-solid fa-box-open text-5xl mb-3 text-cyan-500/40"></i>
            <p>لا توجد منتجات مضافة حالياً في المتجر.</p>
        </div>
    </main>

    <!-- Modal Box -->
    <div id="mediaModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-6">
        <div class="bg-slate-900 border border-cyan-500/40 rounded-3xl max-w-xl w-full p-4 sm:p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-lg bg-slate-800/80 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="modalTitle" class="text-base sm:text-lg font-bold text-cyan-400 mb-4 text-center">معاينة المحتوى</h3>
            <div id="modalContent" class="flex justify-center items-center w-full">
                <!-- Content Inserted Dynamically -->
            </div>
        </div>
    </div>

    <!-- Firebase Code -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARscLA-odqTYyu4Z-eidvewm6WaAVTE3w",
            authDomain: "prime-gifts.firebaseapp.com",
            projectId: "prime-gifts",
            storageBucket: "prime-gifts.firebasestorage.app",
            messagingSenderId: "473045254435",
            appId: "1:473045254435:web:6f4f86077c755b35748c96",
            measurementId: "G-B1GZCNQHWK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const grid = document.getElementById('productsGrid');
        const loading = document.getElementById('loading');
        const noProducts = document.getElementById('noProducts');

        onSnapshot(collection(db, "products"), (snapshot) => {
            let allProducts = [];
            snapshot.forEach((doc) => {
                allProducts.push({ id: doc.id, ...doc.data() });
            });
            loading.style.display = 'none';
            renderProducts(allProducts);
        }, (error) => {
            console.error("Firestore Read Error:", error);
            loading.innerHTML = `
                <div class="p-4 bg-red-950/40 border border-red-500/30 rounded-2xl text-red-400 text-sm max-w-md mx-auto">
                    <i class="fa-solid fa-triangle-exclamation text-lg mb-1"></i><br>
                    <strong>خطأ في قراءة المنتجات:</strong><br>${error.message}
                </div>`;
        });

        function renderProducts(products) {
            grid.innerHTML = '';
            if (products.length === 0) {
                noProducts.classList.remove('hidden');
                return;
            }
            noProducts.classList.add('hidden');

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'cyber-card p-3 flex flex-col';
                
                let imageHtml = '';
                if (p.imageUrl) {
                    let soldOutOverlay = p.isSoldOut ? `<div class="absolute inset-0 bg-black/60 flex items-center justify-center z-10"><span class="sold-out-badge px-3 py-1.5 rounded-xl text-xs font-black tracking-wider shadow-lg"><i class="fa-solid fa-ban ml-1"></i> نفذت الكمية</span></div>` : '';
                    
                    imageHtml = `<div class="relative h-32 sm:h-40 rounded-xl overflow-hidden bg-slate-950 mb-3 group">
                        <img src="${p.imageUrl}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        ${soldOutOverlay}
                        <button onclick="openImageModal('${p.imageUrl}', '${p.name}')" 
                            class="img-preview-badge absolute bottom-2 right-2 px-2.5 py-1 rounded-lg text-[10px] sm:text-xs font-bold flex items-center gap-1.5 shadow-lg z-20">
                            <i class="fa-solid fa-up-right-and-down-left-from-center text-[10px]"></i> مكبر
                        </button>
                    </div>`;
                }

                let videoBtnHtml = '';
                if (p.videoUrl) {
                    videoBtnHtml = `<button onclick="openVideoModal('${p.videoUrl}', '${p.name}')" 
                        class="video-btn-modern w-full py-2 px-3 rounded-xl text-[11px] sm:text-xs font-bold flex items-center justify-center gap-2 mb-3">
                        <span class="w-2 h-2 rounded-full bg-purple-400 play-icon-pulse"></span>
                        <i class="fa-solid fa-play text-xs text-purple-300"></i>
                        <span>معاينة الفيديو</span>
                    </button>`;
                }

                const currencySymbol = p.currency || '';
                
                let actionBtnHtml = '';
                if (p.isSoldOut) {
                    actionBtnHtml = `<span class="bg-red-500/20 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-xl text-[10px] sm:text-xs font-bold shrink-0">نفذت الكمية</span>`;
                } else {
                    actionBtnHtml = `<button onclick="buyViaWhatsApp('${p.name}', '${p.price} ${currencySymbol}', '${encodeURIComponent(p.description || '')}')" 
                        class="whatsapp-buy-btn text-white px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-bold flex items-center gap-1.5 shrink-0">
                        <i class="fa-brands fa-whatsapp text-sm"></i> شراء
                    </button>`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <div class="flex flex-col flex-grow">
                        <h3 class="text-xs sm:text-sm font-bold text-white mb-1 line-clamp-1">${p.name}</h3>
                        <p class="text-slate-400 text-[10px] sm:text-xs mb-3 flex-grow line-clamp-2 leading-relaxed">${p.description || ''}</p>
                        
                        ${videoBtnHtml}

                        <div class="flex items-center justify-between mt-auto pt-2.5 border-t border-slate-800/80 gap-1">
                            <span class="text-cyan-400 font-black text-xs sm:text-sm">${p.price} ${currencySymbol}</span>
                            ${actionBtnHtml}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.buyViaWhatsApp = function(name, fullPrice, encodedDesc) {
            const desc = decodeURIComponent(encodedDesc);
            const message = `مرحباً، أريد شراء هذا المنتج:\n\n*اسم المنتج:* ${name}\n*السعر:* ${fullPrice}\n*التفاصيل:* ${desc}\n\nيرجى إتمام الطلب.`;
            const url = `https://wa.me/201125808758?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        };

        window.openImageModal = function(url, title) {
            const modal = document.getElementById('mediaModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').innerHTML = `<img src="${url}" class="max-h-[70vh] rounded-2xl border border-cyan-500/30 object-contain w-full shadow-lg">`;
            modal.classList.remove('hidden');
        };

        window.openVideoModal = function(url, title) {
            const modal = document.getElementById('mediaModal');
            document.getElementById('modalTitle').innerText = 'فيديو: ' + title;
            
            let videoElement = '';
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                } else if (url.includes('embed/')) {
                    videoId = url.split('embed/')[1].split('?')[0];
                }
                videoElement = `<div class="relative w-full aspect-video rounded-2xl overflow-hidden border border-cyan-500/30"><iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
            } else {
                videoElement = `<video controls autoplay class="w-full rounded-2xl border border-cyan-500/30 max-h-[65vh] bg-black"><source src="${url}" type="video/mp4">متصفحك لا يدعم عرض الفيديو.</video>`;
            }

            document.getElementById('modalContent').innerHTML = videoElement;
            modal.classList.remove('hidden');
        };

        window.closeModal = function() {
            const modal = document.getElementById('mediaModal');
            modal.classList.add('hidden');
            document.getElementById('modalContent').innerHTML = '';
        };
    </script>
</body>
</html>
